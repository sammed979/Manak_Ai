<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MANAK AI — Redirecting…</title>
    <meta http-equiv="refresh" content="0; url=/" />
    <script>
      (function () {
        var target = window.location.pathname + window.location.search + window.location.hash;
        sessionStorage.setItem('manak-404-redirect', target);
        window.location.replace('/?__r=' + encodeURIComponent(target));
      })();
    </script>
    <style>
      html,body { margin:0; padding:0; background:#f9fafb; color:#111827;
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
      .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
      .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
              padding: 2.5rem 3rem; max-width: 520px; box-shadow: 0 4px 16px rgba(0,0,0,.04); text-align: center; }
      h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
      p  { margin: .25rem 0; color: #4b5563; line-height: 1.5; }
      a  { color: #2563eb; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Redirecting to MANAK AI…</h1>
        <p>If you are not redirected in 2 seconds, <a href="/">click here to return home</a>.</p>
      </div>
    </div>
  </body>
</html>
