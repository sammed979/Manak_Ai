services:
  - type: web
    name: manak-ai-backend
    runtime: docker
    repo: https://github.com/sammed979/Manak_Ai
    branch: main
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    numInstances: 1
    healthCheckPath: /health
    autoDeploy: yes
    envVars:
      - key: USE_DOCKER_DB
        value: "true"
      - key: DEBUG
        value: "false"
      - key: DEMO_MODE
        value: "false"
      - key: APP_NAME
        value: "MANAK AI"
      - key: PORT
        value: "8000"
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        fromDatabase:
          name: manak-ai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: manak-ai-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: LLM_PROVIDER
        value: "mock"
      - key: EMBEDDING_PROVIDER
        value: "mock"
      - key: OCR_PROVIDER
        value: "none"
      - key: TRANSLATION_PROVIDER
        value: "mock"
      - key: SPEECH_PROVIDER
        value: "mock"
      - key: CORS_ORIGINS
        sync: false

  - type: redis
    name: manak-ai-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: manak-ai-db
    region: oregon
    plan: starter
    databaseName: manak_ai
    user: manak_ai
    ipAllowList: []
